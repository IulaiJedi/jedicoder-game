name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install pytest
        run: python3 -m pip install --upgrade pytest
      - name: tests
        run: python3 -m pytest
      - name: lint content
        run: python3 scripts/lint_content.py
